<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KZ3FD26Q6M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KZ3FD26Q6M');
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Noise Project | Youth Music Programs in Perth, WA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded as a non-render-blocking preload (rather than a plain
      stylesheet link) — a Lighthouse audit found the plain stylesheet
      link was blocking first paint by ~4.8s under simulated mobile
      conditions. This swaps it to a stylesheet once fetched, with a
      <noscript> fallback for the rare no-JS case.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static, hidden duplicates of the forms rendered by ContactForm.tsx and
      CampSignupForm.tsx. Netlify Forms only detects forms present in the
      raw HTML at build time — it never runs our JS — so without a plain
      HTML copy of each form somewhere in the site, Netlify has no record of
      them and silently drops real submissions. Keep field names here in
      sync with those components if any of them change.
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <form name="camp-signup" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="camp-signup" />
      <input type="text" name="camp" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="date" name="birthday" />
      <input type="text" name="participantAddress" />
      <input type="text" name="instrument" />
      <input type="text" name="emergencyContactName" />
      <input type="tel" name="emergencyContactPhone" />
      <input type="text" name="parentFirstName" />
      <input type="text" name="parentLastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="parentAddress" />
      <input type="text" name="supportNeeds" />
      <textarea name="supportNeedsDetails"></textarea>
    </form>

    <!--
      Submitted alongside "camp-signup" only when a booking's support-needs
      screening question is answered "yes" — kept as its own named form so a
      dedicated email notification can be set up for it in the Netlify
      dashboard (Site settings -> Forms -> Form notifications), separate from
      the notification (if any) on every ordinary "camp-signup" booking.
    -->
    <form name="support-needs-flag" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="support-needs-flag" />
      <input type="text" name="camp" />
      <input type="text" name="participantName" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="details"></textarea>
    </form>

    <!--
      Static duplicate of the shared subscribe form rendered by
      SubscribeForm.tsx — used by the Stay in Touch landing page, the "Stay
      in the Loop" block, and the footer subscribe field. All three post to
      this one "subscribe" form/stream, tagged by the hidden "source" field.
    -->
    <form name="subscribe" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="subscribe" />
      <input type="hidden" name="source" />
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
